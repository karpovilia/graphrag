; Alembic config for GraphRAG Explorer R2.
; Run from backend/ as `alembic -c api/db/alembic.ini upgrade head`,
; or from backend/api/db/ as `alembic upgrade head`.
;
; The DSN itself is resolved at runtime from api.config.get_settings()
; so we don't duplicate connection settings here. To override (e.g. for
; CI), set ALEMBIC_DSN in the environment.

[alembic]
script_location = migrations
prepend_sys_path = ../..
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
